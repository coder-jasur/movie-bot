[project]
name = "movie-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram-dialog>=2.4.0",
    "asyncpg>=0.30.0",
    "colorlog>=6.10.1",
    "environs>=14.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "fastapi[all]",
    "babel>=2.18.0",
    "aiogram>=3.22.0",
    "requests>=2.32.5",
    "celery[redis]>=5.3.0",
    "polib>=1.2.0",
    "deep-translator>=1.11.4",
    "pyrogram>=2.0.106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src/**"]
