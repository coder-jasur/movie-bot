services:
  worker:
    build: .
    container_name: movie_bot-worker
    command: celery -A src.app.core.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env.local
    volumes:
      - .:/app
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: always
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all    # ← bu muhim: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]  # ← "video" NVENC uchun kerak

    networks:
      - tg_bot

  api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: ${TELEGRAM_LOCAL}
      TELEGRAM_MAX_FILE_SIZE: 2000
    command: ["--max-file-size=2000", "--local", "--http-read-timeout=3600"]
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - tg_bot
  
networks:
  tg_bot:
    driver: bridge

volumes:
  telegram-bot-api-data: