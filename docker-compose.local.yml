services:
  worker:
    build: 
      context: .
      dockerfile: worker.Dockerfile
    container_name: movie_bot-worker
    command: celery -A src.app.core.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env.local
    volumes:
      - .:/app
    restart: always
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    networks:
      - tg_bot

networks:
  tg_bot:
    driver: bridge